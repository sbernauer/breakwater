[package]
name = "breakwater"
description = "Pixelflut server"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

default-run = "breakwater"

[[bin]]
name = "breakwater"
path = "src/main.rs"

[dependencies]
breakwater-parser.workspace = true
breakwater-egui-overlay = { workspace = true, optional = true }

async-trait.workspace = true
axum = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
chrono.workspace = true
clap.workspace = true
color-eyre.workspace = true
const_format.workspace = true
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
futures.workspace = true
humantime.workspace = true
libdeflater = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
local-ip-address.workspace = true
memadvise.workspace = true
ndi-sdk-sys = { workspace = true, optional = true }
number_prefix = { workspace = true, optional = true }
page_size.workspace = true
prometheus_exporter = { workspace = true, optional = true }
rusttype = { workspace = true, optional = true }
serde_json.workspace = true
serde.workspace = true
simple_moving_average.workspace = true
softbuffer = { workspace = true, optional = true }
thiserror.workspace = true
tokio-stream.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
vncserver = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true

[features]
# We don't enable binary-sync-pixels and binary-set-pixel by default to make it a bit harder for clients ;)
# VNC and NDI require shared libraries to be installed, so we don't enable them by default
# Yes, egui and winit require a graphical environment, but most people getting started with
# breakwater will likely do that on a desktop, servers admins generally know what they are doing (tm).
# The web sink is enabled by default as well: It is the easiest way to let people watch the canvas
# on a server. It compresses frames with zlib-rs, which is pure Rust, so having it on by default
# doesn't force a C toolchain on anyone.
default = ["prometheus", "egui", "winit", "web"]

# Enables the Prometheus metrics exporter. Can be disabled to support compilation on 32-bit targets.
# See https://github.com/tikv/rust-prometheus/issues/565
prometheus = ["dep:prometheus_exporter"]
alpha = ["breakwater-parser/alpha"]
binary-set-pixel = ["breakwater-parser/binary-set-pixel"]
binary-sync-pixels = ["breakwater-parser/binary-sync-pixels"]
egui = ["dep:breakwater-egui-overlay", "dep:bytemuck", "dep:eframe", "dep:egui", "dep:libloading"]
winit = ["dep:softbuffer", "dep:winit"]
vnc = ["dep:vncserver", "dep:number_prefix", "dep:rusttype"]
ndi = ["dep:ndi-sdk-sys"]
web = ["dep:axum", "dep:bytes", "dep:flate2"]
# Compress the web sink's frames with libdeflate instead of the default zlib-rs. libdeflate is C,
# but vendored and built from source, so there is no system library to install - you only need a C
# compiler at build time. In exchange it gives a noticeably better compression per CPU.
# See breakwater/src/sinks/web/README.md for performance details.
web-libdeflate = ["web", "dep:libdeflater"]

[lints]
workspace = true
