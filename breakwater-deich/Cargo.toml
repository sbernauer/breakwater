[package]
name = "breakwater-deich"
description = "Distributed Pixelflut server"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

[[bin]]
name = "breakwater-deich"
path = "src/main.rs"

[dependencies]
breakwater-parser = { workspace = true, features = ["time-tracking"] }
breakwater = { workspace = true, default-features = false, features = ["prometheus"] }

clap.workspace = true
color-eyre.workspace = true
postcard.workspace = true
prometheus_exporter.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# We enable the same features by default as breakwater
# (Prometheus metrics are always enabled for now)
default = ["egui", "winit", "web"]

binary-set-pixel = ["breakwater/binary-set-pixel", "breakwater-parser/binary-set-pixel"]
egui = ["breakwater/egui"]
winit = ["breakwater/winit"]
vnc = ["breakwater/vnc"]
ndi = ["breakwater/ndi"]
web = ["breakwater/web"]

[lints]
workspace = true
